limit_req_zone $binary_remote_addr zone=nexahedron_gateway:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gateway.nexahedron.com gateway-origin.nexahedron.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.nexahedron.com gateway-origin.nexahedron.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/gateway.nexahedron.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.nexahedron.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4317/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location = /orientation/v1/requests {
        limit_except POST { deny all; }
        limit_req zone=nexahedron_gateway burst=5 nodelay;
        proxy_pass http://127.0.0.1:4317/orientation/v1/requests;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    location / {
        return 404;
    }
}
